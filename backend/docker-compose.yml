version: '3.8'

services:
  # FastAPI API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aura-api-gateway
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://aura_user:aura_secret_pass@postgres:5432/aura_fitting_room
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=aura_minio_admin
      - MINIO_SECRET_KEY=aura_minio_supersecret
      - MINIO_SECURE=false
      - MINIO_BUCKET_NAME=aura-ephemeral-captures
      - JWT_SECRET_KEY=aura_kiosk_secret_jwt_key_2026_x99
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./app:/app/app
    restart: unless-stopped

  # Celery AI Task Consumer (GPU Worker / Simulation Worker)
  vton-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aura-vton-worker
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info -c 2 -Q tryon_queue
    environment:
      - DATABASE_URL=postgresql+asyncpg://aura_user:aura_secret_pass@postgres:5432/aura_fitting_room
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=aura_minio_admin
      - MINIO_SECRET_KEY=aura_minio_supersecret
      - MINIO_SECURE=false
      - MINIO_BUCKET_NAME=aura-ephemeral-captures
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    restart: unless-stopped

  # Background Purge Reconciliation Daemon (Enforces 15-min TTL hard purge)
  purge-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aura-purge-daemon
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=aura_minio_admin
      - MINIO_SECRET_KEY=aura_minio_supersecret
      - MINIO_SECURE=false
      - MINIO_BUCKET_NAME=aura-ephemeral-captures
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    restart: unless-stopped

  # PostgreSQL Relational Metadata Database
  postgres:
    image: postgres:16-alpine
    container_name: aura-postgres
    environment:
      - POSTGRES_USER=aura_user
      - POSTGRES_PASSWORD=aura_secret_pass
      - POSTGRES_DB=aura_fitting_room
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura_user -d aura_fitting_room"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Broker for Message Queue & WebSockets
  redis:
    image: redis:7-alpine
    container_name: aura-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MinIO Ephemeral Encrypted Object Storage (15-min TTL)
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-28Z
    container_name: aura-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=aura_minio_admin
      - MINIO_ROOT_PASSWORD=aura_minio_supersecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
